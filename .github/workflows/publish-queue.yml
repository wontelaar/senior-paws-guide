name: Publish queue

# Releases at most one approved-but-unpublished draft per run, twice a day
# (12h apart). Approval (setting `approved: true` in a post's frontmatter)
# happens separately — during a review pass, by Claude or by hand — so
# reviewing a batch of drafts at once doesn't turn into a same-day burst
# of new live posts beyond this two-per-day cap.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 1 * * *' # daily, 01:00 UTC
    - cron: '0 13 * * *' # daily, 13:00 UTC

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Publish next approved draft
        id: publish
        run: node scripts/publish-next.mjs

      - name: Commit
        if: steps.publish.outputs.published_file
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.publish.outputs.published_file }}"
          git commit -m "publish: $(basename "${{ steps.publish.outputs.published_file }}" .md)"
          git push
