name: Generate content

# Manual trigger for testing, plus a twice-daily schedule (12h apart, one
# per run). This only generates a draft (draft: true, invisible on the
# site) — the separate publish-queue workflow is what throttles actual
# publishing, so generating twice a day here does not translate into a
# burst-y live posting velocity. It does mean the topic backlog
# (data/topics.json) empties roughly twice as fast — plan on refilling
# "ready" topics more often (every few days, not every 1-2 weeks).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *' # daily, 02:00 UTC
    - cron: '0 14 * * *' # daily, 14:00 UTC

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Generate draft post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate

      # Every generated post is written with `draft: true`, so it does not
      # appear on the live site regardless of this step's result. QA
      # failures are surfaced as a workflow warning, not a blocker — a
      # human still reviews every draft before flipping it to published.
      - name: Run QA gate (informational)
        if: steps.generate.outputs.post_path
        run: |
          npm run qa -- "${{ steps.generate.outputs.post_path }}" || \
          echo "::warning::QA gate flagged ${{ steps.generate.outputs.topic_id }} — needs a closer human look before publishing."

      - name: Commit draft
        if: steps.generate.outputs.post_path
        run: |
          git config user.name "content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.generate.outputs.post_path }}"
          git commit -m "content: draft ${{ steps.generate.outputs.topic_id }}"
          git push
